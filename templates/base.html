<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sistema de Chamados</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header>
        <div class="header-inner">
            <div class="brand">
                <span class="brand-icon">◆</span>
                <span>Sistema de Chamados</span>
            </div>
            <nav>
                <a href="{{ url_for('index') }}">Chamados</a>
                <a href="{{ url_for('relatorios') }}">Relatórios</a>
                <a href="{{ url_for('novo_chamado') }}" class="nav-cta">+ Novo chamado</a>
                {% if logado %}
                    <span class="nav-user">👤 {{ usuario_nome }}</span>
                    <button type="button" class="nav-logout" onclick="fazerLogout()">Sair</button>
                {% else %}
                    <button type="button" class="nav-login" onclick="abrirLogin()">Entrar</button>
                {% endif %}
            </nav>
        </div>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>

    <!-- Modal de Login -->
    <div id="modalLogin" class="modal-overlay" onclick="if(event.target === this) fecharLogin()">
        <div class="modal-caixa modal-caixa-pequena">
            <div class="modal-header">
                <h3>Entrar no sistema</h3>
                <span class="modal-fechar" onclick="fecharLogin()">&times;</span>
            </div>
            <div class="modal-corpo">
                <div class="form-login">
                    <label>Usuário</label>
                    <input type="text" id="loginUsuario" autocomplete="username" autofocus>
                    <label>Senha</label>
                    <input type="password" id="loginSenha" autocomplete="current-password">
                    <div id="loginErro" class="login-erro" style="display:none;"></div>
                    <button type="button" onclick="submitLogin()">Entrar</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        function abrirLogin() {
            document.getElementById('loginErro').style.display = 'none';
            document.getElementById('loginUsuario').value = '';
            document.getElementById('loginSenha').value = '';
            document.getElementById('modalLogin').classList.add('aberto');
            setTimeout(() => document.getElementById('loginUsuario').focus(), 50);
        }
        function fecharLogin() { document.getElementById('modalLogin').classList.remove('aberto'); }

        async function submitLogin() {
            const usuario = document.getElementById('loginUsuario').value.trim();
            const senha = document.getElementById('loginSenha').value;
            const erroDiv = document.getElementById('loginErro');
            const r = await fetch('/api/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({usuario, senha})
            });
            if (r.ok) { fecharLogin(); location.reload(); }
            else { erroDiv.textContent = 'Usuário ou senha incorretos.'; erroDiv.style.display = 'block'; }
        }
        async function fazerLogout() { await fetch('/api/logout', {method: 'POST'}); location.reload(); }

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && document.getElementById('modalLogin').classList.contains('aberto')) submitLogin();
            if (e.key === 'Escape') {
                fecharLogin();
                if (typeof fecharHistorico === 'function') fecharHistorico();
                if (typeof fecharModal === 'function') fecharModal();
            }
        });
    </script>
</body>
</html>
